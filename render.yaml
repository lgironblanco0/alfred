services:
  - type: web
    name: alfred
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm --prefix web ci --include=dev && npm run build && npm --prefix web run build && npx prisma migrate deploy && npm run db:seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALFRED_ALLOW_DEMO_SEED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGINS
        sync: false
