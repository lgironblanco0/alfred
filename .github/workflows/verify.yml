name: Verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Typecheck, builds, tests y E2E
    runs-on: ubuntu-24.04

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/alfred?schema=public"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alfred
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alfred"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Instalar backend
        run: npm ci

      - name: Instalar frontend
        run: npm --prefix web ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Aplicar migraciones
        run: npx prisma migrate deploy

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Verificar
        run: npm run verify
